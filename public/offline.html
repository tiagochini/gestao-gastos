<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#155bd7">
    <title>Sem conexao - Gestao de Gastos</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #f8fafc;
            color: #111827;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(440px, calc(100% - 32px));
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
            padding: 28px;
        }

        .icon {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            color: #ffffff;
            background: #155bd7;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 26px;
            line-height: 1.15;
        }

        p {
            margin: 0;
            color: #6b7280;
            line-height: 1.6;
        }

        button {
            height: 44px;
            margin-top: 22px;
            padding: 0 18px;
            border: 0;
            border-radius: 6px;
            background: #155bd7;
            color: #ffffff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28">
                <path fill="currentColor" d="M3 3H21V21H3V3M7 17H9V10H7V17M11 17H13V7H11V17M15 17H17V13H15V17Z" />
            </svg>
        </div>
        <h1>Sem conexao</h1>
        <p>O aplicativo esta instalado, mas esta tela precisa de internet para carregar dados atualizados.</p>
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
</body>
</html>
